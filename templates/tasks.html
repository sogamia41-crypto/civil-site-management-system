{% extends "base.html" %}

{% block content %}

<h1>📋 工地日常進度與待辦事項</h1>

<section class="panel">

    <h2>新增待辦事項</h2>

    <form method="POST">

        <div style="display:grid; grid-template-columns:2fr 1fr 1fr 2fr; gap:12px; align-items:end;">

            <div>
                <label>待辦事項</label>
                <input
                    type="text"
                    name="title"
                    placeholder="例如：訂購模板材料"
                    required
                    style="width:100%;">
            </div>

            <div>
                <label>類別</label>
                <select name="category" style="width:100%;">

                    <option value="材料">材料</option>
                    <option value="協力廠商">協力廠商</option>
                    <option value="行政">行政</option>
                    <option value="施工">施工</option>
                    <option value="安全">安全</option>
                    <option value="其他">其他</option>

                </select>
            </div>

            <div>
                <label>日期</label>
                <input
                    type="date"
                    name="task_date"
                    required
                    style="width:100%;">
            </div>

            <div>
                <label>備註</label>
                <input
                    type="text"
                    name="note"
                    placeholder="可填寫相關說明"
                    style="width:100%;">
            </div>

        </div>

        <br>

        <button type="submit" class="btn btn-primary">
            ＋ 新增待辦事項
        </button>

    </form>

</section>


<section class="panel">

    <h2>待辦事項列表</h2>

    {% if tasks %}

    <table>

        <tr>
            <th>日期</th>
            <th>待辦事項</th>
            <th>類別</th>
            <th>狀態</th>
            <th>備註</th>
            <th>操作</th>
        </tr>

        {% for task in tasks %}

        <tr>

            <td>
                {{ task.task_date }}
            </td>

            <td>
                <strong>{{ task.title }}</strong>
            </td>

            <td>
                {{ task.category }}
            </td>

            <td>

                <form
                    method="POST"
                    action="{{ url_for('task_update', id=task.id) }}">

                    <select
                        name="status"
                        onchange="this.form.submit()">

                        <option value="待處理"
                            {% if task.status == "待處理" %}selected{% endif %}>
                            待處理
                        </option>

                        <option value="進行中"
                            {% if task.status == "進行中" %}selected{% endif %}>
                            進行中
                        </option>

                        <option value="已完成"
                            {% if task.status == "已完成" %}selected{% endif %}>
                            已完成
                        </option>

                    </select>

                </form>

            </td>

            <td>
                {{ task.note or "—" }}
            </td>

            <td>

                <form
                    method="POST"
                    action="{{ url_for('task_delete', id=task.id) }}"
                    onsubmit="return confirm('確定要刪除這筆待辦事項嗎？');">

                    <button type="submit">
                        刪除
                    </button>

                </form>

            </td>

        </tr>

        {% endfor %}

    </table>

    {% else %}

    <div style="padding:30px; text-align:center;">
        <p>目前尚無待辦事項。</p>
    </div>

    {% endif %}

</section>

{% endblock %}
