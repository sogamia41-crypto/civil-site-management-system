{% extends "base.html" %}{% block content %}<h1>材料管理</h1>
<div class="grid"><section class="panel"><h2>新增材料</h2><form method="post">
<input name="name" placeholder="材料名稱" required><input name="unit" placeholder="單位，例如：噸、包、m³" required>
<input name="min_stock" type="number" step="0.01" placeholder="最低庫存量" required><button>新增</button></form></section>
<section class="panel"><h2>庫存表</h2><table><tr><th>材料</th><th>單位</th><th>目前庫存</th><th>最低庫存</th><th>狀態</th></tr>
{% for m in materials %}<tr class="{% if m.stock < m.min_stock %}danger{% endif %}"><td>{{m.name}}</td><td>{{m.unit}}</td><td>{{"%.2f"|format(m.stock)}}</td><td>{{m.min_stock}}</td>
<td>{% if m.stock < m.min_stock %}<span class="badge red">需叫料</span>{% else %}<span class="badge green">正常</span>{% endif %}</td></tr>{% endfor %}</table></section></div>{% endblock %}
