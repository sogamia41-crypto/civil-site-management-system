{% extends "base.html" %}{% block content %}<h1>日常行政零用金</h1>
<section class="panel"><form method="post" class="formgrid">
<input name="category" placeholder="類別：便當/五金/交通" required><input name="description" placeholder="支出內容" required>
<input name="amount" type="number" step="0.01" placeholder="金額" required><input name="payee" placeholder="付款對象">
<input name="expense_date" type="date" required><label><input type="checkbox" name="reimbursed"> 已核銷</label><input name="note" placeholder="備註"><button>新增支出</button>
</form></section><section class="panel"><table><tr><th>日期</th><th>類別</th><th>內容</th><th>金額</th><th>付款對象</th><th>核銷</th></tr>
{% for e in expenses %}<tr><td>{{e.expense_date}}</td><td>{{e.category}}</td><td>{{e.description}}</td><td>{{e.amount}}</td><td>{{e.payee}}</td><td>{{"已核銷" if e.reimbursed else "未核銷"}}</td></tr>{% endfor %}</table></section>{% endblock %}
