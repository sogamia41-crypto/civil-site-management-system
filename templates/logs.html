{% extends "base.html" %}{% block content %}<h1>材料進出貨與單據對帳</h1>
<section class="panel"><form method="post" class="formgrid">
<select name="material_id" required><option value="">選材料</option>{% for m in materials %}<option value="{{m.id}}">{{m.name}}</option>{% endfor %}</select>
<select name="log_type"><option>進貨</option><option>領料</option></select><input name="quantity" type="number" step="0.01" placeholder="數量" required>
<select name="vendor_id"><option value="">供應商（領料可空白）</option>{% for v in vendors %}<option value="{{v.id}}">{{v.name}}</option>{% endfor %}</select>
<input name="unit_price" type="number" step="0.01" placeholder="單價"><input name="invoice_no" placeholder="發票/單據號碼">
<input name="log_date" type="date" value="2026-11-16" required><label><input type="checkbox" name="reconciled"> 已請款/對帳</label>
<input name="note" placeholder="備註"><button>新增紀錄</button></form></section>
<section class="panel"><table><tr><th>日期</th><th>材料</th><th>類型</th><th>數量</th><th>供應商</th><th>單價</th><th>單據</th><th>對帳</th><th>操作</th></tr>
{% for l in logs %}<tr><td>{{l.log_date}}</td><td>{{l.material}}</td><td>{{l.log_type}}</td><td>{{l.quantity}} {{l.unit}}</td><td>{{l.vendor or "—"}}</td><td>{{l.unit_price}}</td><td>{{l.invoice_no or "—"}}</td>
<td>{% if l.reconciled %}<span class="badge green">已對帳</span>{% else %}<span class="badge yellow">未對帳</span>{% endif %}</td>
<td><form method="post" action="/logs/delete/{{l.id}}" onsubmit="return confirm('確定刪除？')"><button class="dangerbtn">刪除</button></form></td></tr>{% endfor %}</table></section>{% endblock %}
